# Atelier : fabrique UNE vidéo à partir d'un brouillon précis, avec la vraie voix, sans passer par le pilote.
# Sert à tester un nouveau style ou un nouveau format. La vidéo arrive sur Telegram et reste téléchargeable
# dans l'onglet « Artifacts » du lancement. Rien n'est mis en file d'attente ni publié.
name: Atelier (vidéo de test)
on:
  workflow_dispatch:
    inputs:
      brouillon:
        description: "Brouillon à fabriquer (chemin dans le dépôt)"
        default: "brouillons/demo-v3-hacker.json"
      chaine:
        description: "Chaîne"
        default: "gta6-fr"
      apercu:
        description: "Aperçu seulement (voix + planches des images, sans rendu ni envoi)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: atelier
jobs:
  fabriquer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Outils système
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter bzip2
      - name: Cache des modèles et du moteur de rendu
        uses: actions/cache@v4
        with:
          path: |
            models
            rendu/node_modules
          key: usine-${{ hashFiles('rendu/package-lock.json') }}-v1
      - name: Installation
        run: |
          pip install kokoro-onnx soundfile sherpa-onnx requests numpy pillow
          mkdir -p models && cd models
          [ -f kokoro-v1.0.onnx ] || wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          [ -d sherpa-onnx-whisper-small ] || { wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2 && tar xjf sherpa-onnx-whisper-small.tar.bz2 && rm sherpa-onnx-whisper-small.tar.bz2; }
          cd ../rendu && npm ci
      - name: Empreinte de la voix (pour réutiliser la même prise d'un lancement à l'autre)
        id: empreinte
        env:
          BROUILLON: ${{ inputs.brouillon }}
        run: echo "h=$(python3 -c "import json,hashlib,os;s=json.load(open(os.environ['BROUILLON']));print(hashlib.md5(json.dumps([[x['voix'],x.get('voix_jeu','')] for x in s['scenes']],ensure_ascii=False).encode()).hexdigest())")" >> "$GITHUB_OUTPUT"
      - name: Voix et clips déjà fabriqués
        uses: actions/cache@v4
        with:
          path: |
            sortie/atelier/voix_elevenlabs.mp3
            sortie/atelier/alignement_elevenlabs.json
            sortie/atelier/.voix_empreinte
            cache_visuels
          key: atelier-voix-${{ steps.empreinte.outputs.h }}
      - name: Fabrication
        env:
          BROUILLON: ${{ inputs.brouillon }}
          CHAINE: ${{ inputs.chaine }}
          APERCU: ${{ inputs.apercu }}
        run: |
          chmod +x fabriquer.sh
          python3 valider_storyboard.py "$BROUILLON" "chaines/$CHAINE.json" sortie/atelier/storyboard.json
          if [ "$APERCU" = "true" ]; then
            ./fabriquer.sh sortie/atelier/storyboard.json sortie/atelier/ --apercu
          else
            ./fabriquer.sh sortie/atelier/storyboard.json sortie/atelier/
            TITRE=$(python3 -c "import json;print(json.load(open('sortie/atelier/storyboard.json'))['titre'])")
            python3 veto.py atelier sortie/atelier "🧪 Atelier : $TITRE"
          fi
          cat sortie/atelier/controle_voix.txt || true
      - name: Planche de contrôle (pour que Claude voie le résultat)
        if: success()
        run: |
          mkdir -p controle
          [ -f sortie/atelier/video.mp4 ] && ffmpeg -loglevel error -y -i sortie/atelier/video.mp4 -vf "fps=1/2,scale=270:480,tile=8x2:padding=4" -frames:v 1 controle/planche.jpg
          for f in controle_voix.txt planche_visuels.jpg candidats.jpg; do [ -f "sortie/atelier/$f" ] && cp "sortie/atelier/$f" controle/; done
          git config user.name "usine-bot" && git config user.email "usine-bot@users.noreply.github.com"
          git checkout --orphan atelier-controle && git rm -rq --cached . && git add controle && git commit -qm "Contrôle atelier $(date +%F-%H%M)"
          git push -f origin atelier-controle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier
          retention-days: 7
          path: |
            sortie/atelier/video.mp4
            sortie/atelier/storyboard.json
            sortie/atelier/timing.json
            sortie/atelier/controle_voix.txt
            sortie/atelier/voix_elevenlabs.mp3
