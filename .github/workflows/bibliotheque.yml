# Bibliothèque : découpe en plans les vidéos officielles déposées dans la release « bibliotheque » du dépôt
# (t1.mp4, t2.mp4, el.mp4) et prépare des planches contact. À relancer après chaque nouveau dépôt de vidéo.
name: Bibliothèque (vidéos officielles)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Récupérer les vidéos de la release
        run: |
          mkdir -p bibliotheque/sources
          gh release download bibliotheque -D bibliotheque/sources -p "*.mp4"
      - name: Découper
        run: python3 bibliotheque.py decouper
      - name: Enregistrer le catalogue et les planches
        run: |
          git config user.name "usine-bot" && git config user.email "usine-bot@users.noreply.github.com"
          git add bibliotheque/catalogue.json bibliotheque/planches
          git commit -m "Bibliothèque : catalogue et planches" || echo "rien de neuf"
          git push
