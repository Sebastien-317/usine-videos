# Construit la bibliothèque des plans officiels de GTA 6 (kit média Rockstar : rockstargames.com/VI/media).
# À lancer à la main une fois, puis quand Rockstar publie de nouvelles vidéos (ajouter l'URL dans officiel.py).
# Les vidéos verticales restent dans le cache GitHub (clé officiel-v1) ; plans.json et les vecteurs CLIP sont versionnés.
name: Bibliothèque officielle GTA 6
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: usine
jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Outils
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install open_clip_torch numpy pillow requests
      - name: Cache des vidéos officielles verticales
        uses: actions/cache@v4
        with:
          path: cache_officiel
          key: officiel-v1
      - name: Construction (recadrage, plans, CLIP)
        run: python3 officiel.py construire
      - name: Contrôle (planches de recherche d'essai)
        run: |
          mkdir -p controle
          python3 - <<'EOF'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from officiel import Bibliotheque, vignette
          b = Bibliotheque()
          qs = ["woman holding gun", "police chase night", "stack of cash", "beach palm trees", "nightclub party",
                "prison", "alligator swamp", "sports car", "helicopter", "man on his phone"]
          f = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 13)
          W, H = 108, 192
          pl = Image.new("RGB", (8 * (W + 4) + 4, len(qs) * (H + 24) + 4))
          d = ImageDraw.Draw(pl)
          for li, q in enumerate(qs):
              y = 4 + li * (H + 24)
              d.text((6, y), q, fill=(255, 210, 63), font=f)
              for k, (p, s) in enumerate(b.chercher(q, 8)):
                  x = 4 + k * (W + 4)
                  pl.paste(Image.open(vignette(p)).convert("RGB").resize((W, H)), (x, y + 20))
                  d.text((x + 2, y + 21), p["id"], fill=(255, 255, 255), font=f)
              print(q, [p["id"] for p, _ in b.chercher(q, 8)])
          pl.save("controle/officiel_essai.jpg", quality=80)
          EOF
          rm -rf cache_officiel/zip cache_officiel/GTAVI_Videos.zip
          du -sh cache_officiel; ls -la cache_officiel bibliotheque/officiel
      - name: Enregistrement
        run: |
          git config user.name "usine-bot" && git config user.email "usine-bot@users.noreply.github.com"
          git add bibliotheque/officiel && git commit -m "Bibliothèque officielle GTA 6 : plans et vecteurs CLIP" || echo "rien de neuf"
          git pull --rebase && git push
          git checkout --orphan officiel-controle && git rm -rq --cached . && git add -f controle && git commit -qm "Planche d'essai" && git push -f origin officiel-controle
