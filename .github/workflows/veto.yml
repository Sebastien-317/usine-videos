# Plusieurs fois par jour : lit les boutons « Annuler » / messages « stop » sur Telegram
# et supprime les publications concernées chez Upload-Post.
name: Veto Telegram
# Inutile en mode « manuel » (tu publies toi-même) : décommente « schedule » quand tu passes en mode « programmer ».
on:
#  schedule:
#    - cron: "0 8 * * *"      # 9 h à Paris (hiver)
#    - cron: "30 9 * * *"     # 10 h 30
#    - cron: "15 10 * * *"    # 11 h 15
#    - cron: "0 15 * * *"     # 16 h
#    - cron: "0 17 * * *"     # 18 h
  workflow_dispatch:
permissions:
  contents: write
concurrency: usine
jobs:
  veto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python3 veto.py lire
      - name: Enregistrer
        run: |
          git config user.name "usine-bot" && git config user.email "usine-bot@users.noreply.github.com"
          git add file_attente && git commit -m "Veto $(date +%F-%H%M)" && git push || echo "rien à enregistrer"
